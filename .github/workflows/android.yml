name: 안드로이드 빌드

# main에 코드를 올리면 GitHub 서버가 두 가지를 만들어 '안드로이드 테스트 빌드' 릴리스에 올려둔다.
#  - charye-test.apk : 갤럭시에 바로 설치해 보는 테스트용
#  - charye-release.aab : 플레이 콘솔에 올리는 출시용 (저장소 시크릿 ANDROID_KEYSTORE_PASSWORD가 있을 때만)
# 버전 번호(versionCode)는 빌드할 때마다 1씩 올라가서 플레이 콘솔에 매번 새 버전으로 올릴 수 있다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 패키지 설치
        run: npm install

      - name: 앱용 웹 파일 만들기 (폰트 내장)
        run: npm run build:web

      - name: 안드로이드 프로젝트 만들기
        run: |
          npx cap add android
          npx cap sync android

      - name: 세로 화면 고정
        run: |
          sed -i -E 's/<activity([[:space:]]|$)/<activity android:screenOrientation="portrait"\1/' android/app/src/main/AndroidManifest.xml
          grep -q 'screenOrientation="portrait"' android/app/src/main/AndroidManifest.xml

      - name: 버전 번호 넣기
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: 테스트용 APK 빌드
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 테스트용 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk charye-test.apk

      - name: 출시용 AAB 빌드 (서명)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::notice::ANDROID_KEYSTORE_PASSWORD 시크릿이 없어서 출시용 빌드는 건너뜀"
            exit 0
          fi
          (cd android && ./gradlew bundleRelease --no-daemon)
          # SHA-256으로 직접 서명 (cap build는 SHA1을 써서 쓰지 않음)
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$GITHUB_WORKSPACE/release/upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -signedjar charye-release.aab \
            android/app/build/outputs/bundle/release/app-release.aab upload
          jarsigner -verify -verbose charye-release.aab > verify.txt 2>&1 || true
          grep -E 'Digest algorithm|Signature algorithm|jar verified|unsigned|disabled' verify.txt | sort -u
          grep -q 'jar verified' verify.txt && ! grep -qi 'disabled' verify.txt

      - name: 테스트 빌드 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="charye-test.apk"
          [ -f charye-release.aab ] && FILES="$FILES charye-release.aab"
          NOTES="- 갤럭시에서 바로 설치: charye-test.apk
          - 플레이 콘솔에 올리기: charye-release.aab
          버전 코드 ${{ github.run_number }} · 커밋 ${GITHUB_SHA::7} · $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 빌드"
          if gh release view android-test >/dev/null 2>&1; then
            gh release upload android-test $FILES --clobber
            gh release edit android-test --notes "$NOTES"
          else
            gh release create android-test $FILES --prerelease --title "안드로이드 테스트 빌드" --notes "$NOTES"
          fi
